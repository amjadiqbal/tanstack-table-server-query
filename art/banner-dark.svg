  <g font-family="Menlo, 'SF Mono', Consolas, monospace"><rect x="850" y="34" width="320" height="34.96" rx="17.48" fill="#0F172A" stroke="#A3E635" stroke-width="2"/><text x="866.56" y="56.4" font-size="12.4" fill="#A3E635" font-weight="700">sort=-total&amp;f.status=paid&amp;page=3</text><g stroke="#A3E635" stroke-width="2.8" stroke-linecap="round" fill="none"><path d="M1010.0 72.64000000000001 v14.72"/><path d="M1003.56 80.92000000000002 l6.44 6.44 l6.44 -6.44"/></g><rect x="850" y="94.72000000000001" width="320" height="86.48000000000002" rx="11.040000000000001" fill="#0F172A" stroke="#24324F"/><text x="866.56" y="120.5" font-size="12.9" xml:space="preserve"><tspan fill="#7DD3FC" font-weight="700">WHERE </tspan><tspan fill="#E2E8F0">status = </tspan><tspan fill="#A3E635">$1</tspan></text><text x="866.56" y="142.6" font-size="12.9" xml:space="preserve"><tspan fill="#7DD3FC" font-weight="700">ORDER BY </tspan><tspan fill="#E2E8F0">total DESC, id ASC</tspan></text><text x="866.56" y="164.6" font-size="12.9" xml:space="preserve"><tspan fill="#7DD3FC" font-weight="700">LIMIT </tspan><tspan fill="#A3E635">10</tspan><tspan fill="#7DD3FC" font-weight="700"> OFFSET </tspan><tspan fill="#A3E635">20</tspan></text></g>
